services:
  - type: web
    name: omnistream-ai
    runtime: docker
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: DEMO_DAILY_BUDGET_USD
        value: "1.00"
      - key: DEMO_MAX_TOKEN_USD_PER_MILLION
        value: "5.00"
      - key: SPRING_PROFILES_ACTIVE
        value: hosted
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: API_KEY
        generateValue: true
